
[env:esp32-s3-devkitc-1]

; 使用 pioarduino，以获得 Arduino-ESP32 3.x 支持

platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

  

; Arduino-ESP32 3.3.11

platform_packages = pioarduino/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz

  

; Waveshare 这块板没有独立的 PlatformIO board 定义，

; 基于 ESP32-S3-DevKitC-1 配置硬件

board = esp32-s3-devkitc-1

framework = arduino

  

monitor_speed = 115200

upload_speed = 921600

  

board_build.flash_size = 16MB

board_upload.flash_size = 16MB

board_build.partitions = default_16MB.csv

  

; ESP32-S3R8

board_build.arduino.memory_type = qio_opi

board_build.flash_mode = qio

; 关键：通过 USB CDC 输出 Serial

build_flags =

    -DARDUINO_USB_CDC_ON_BOOT=1

    -DARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -I lib/ESGUI
    -I lib/ESGUI/BSP
    -I lib/ESGUI/Adapter
    -I lib/ESGUI/Font
    -I src

    ; ===== 字体：真·30px 字库 + 1:1 映射（见 src/tft_drv.h 与 tools/gen_font_big.py）=====
    ; 为什么不用"像素放大"字体：放大只是把 16px 点阵拉成 2x2 方块，笔画细节不会增加（越大越糊）。
    ; 这里改用按最终尺寸渲染的真字库（PingFang SC 30px，line_height=33），配合 TFT_ZOOM=1
    ; 做 1:1 映射 → 字又大又锐利。想换字号就重新生成：
    ;   python3 tools/gen_font_big.py --size 26  (或 34 …)，再改 -include 无需改动
    -DESGUI_DEFAULT_FONT=font_big
    -DESGUI_KEY_BOARD_FONT=font_big
    -include font_big.h

    ; ===== 框架"像素级样式常量"（1:1 映射，单位=面板像素），按 30px 字（行高 33）调过 =====
    -DESGUI_PROGRESS_BAR_W=4
    -DESGUI_TEXT_RIGHT_GAP=6
    -DESGUI_ITEM_SPACING=6
    -DESGUI_LONG_TEXT_GAP=30
    -DESGUI_BOOL_POPWINDOW_TEXT_GAP=30
    -DESGUI_FOCUS_BOX_PAD_X=8
    -DESGUI_TEXT_MARGIN_X=8
    -DESGUI_TITLE_LINE_OFFSET=2
    -DESGUI_BMP_ITEM_GAP=16
    -DESGUI_KEY_BOARD_KEY_H=36
    -DESGUI_POPUP_TITLE_SCROLL_MARGIN=6
    -DESGUI_3D_MENU_ITEM_GAP=16
    -DESGUI_3D_MENU_MODEL_SCALE=33

