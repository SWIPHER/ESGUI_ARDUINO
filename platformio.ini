
[env:esp32-s3-devkitc-1]

; 使用 pioarduino，以获得 Arduino-ESP32 3.x 支持

platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

  

; Arduino-ESP32 3.3.11

platform_packages = pioarduino/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz

  

; Waveshare 这块板没有独立的 PlatformIO board 定义，

; 基于 ESP32-S3-DevKitC-1 配置硬件

board = esp32-s3-devkitc-1

framework = arduino

  

monitor_speed = 115200

upload_speed = 921600

  

board_build.flash_size = 16MB

board_upload.flash_size = 16MB

board_build.partitions = default_16MB.csv

  

; ESP32-S3R8

board_build.arduino.memory_type = qio_opi

board_build.flash_mode = qio

; 关键：通过 USB CDC 输出 Serial

build_flags =

    -DARDUINO_USB_CDC_ON_BOOT=1

    -DARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -I lib/ESGUI
    -I lib/ESGUI/BSP
    -I lib/ESGUI/Adapter
    -I lib/ESGUI/Font

