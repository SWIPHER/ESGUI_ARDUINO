
[env:esp32-s3-devkitc-1]

; 使用 pioarduino，以获得 Arduino-ESP32 3.x 支持

platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

  

; Arduino-ESP32 3.3.11

platform_packages = pioarduino/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz

  

; Waveshare 这块板没有独立的 PlatformIO board 定义，

; 基于 ESP32-S3-DevKitC-1 配置硬件

board = esp32-s3-devkitc-1

framework = arduino

  

monitor_speed = 115200

upload_speed = 921600

  

board_build.flash_size = 16MB

board_upload.flash_size = 16MB

board_build.partitions = default_16MB.csv

  

; ESP32-S3R8

board_build.arduino.memory_type = qio_opi

board_build.flash_mode = qio

; 关键：通过 USB CDC 输出 Serial

build_flags =

    -DARDUINO_USB_CDC_ON_BOOT=1

    -DARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -I lib/ESGUI
    -I lib/ESGUI/BSP
    -I lib/ESGUI/Adapter
    -I lib/ESGUI/Font

    ; ===== UI 缩放：逻辑区 112x128 + 驱动 2 倍放大（见 src/tft_drv.h 的 TFT_ZOOM）=====
    ; 逻辑区变小 → 放大后字与图形整体 2 倍大，并自动躲开面板圆角（居中留安全边距）。
    ; 下面这些是框架的"像素级样式常量"，按 1/2 设置，放大 2 倍后观感与原来的 240x280@1x 一致：
    -DESGUI_PROGRESS_BAR_W=2
    -DESGUI_TEXT_RIGHT_GAP=3
    -DESGUI_ITEM_SPACING=3
    -DESGUI_LONG_TEXT_GAP=12
    -DESGUI_BOOL_POPWINDOW_TEXT_GAP=10
    -DESGUI_FOCUS_BOX_PAD_X=3
    -DESGUI_TEXT_MARGIN_X=3
    -DESGUI_TITLE_LINE_OFFSET=1
    -DESGUI_BMP_ITEM_GAP=8
    -DESGUI_KEY_BOARD_KEY_H=16
    -DESGUI_POPUP_TITLE_SCROLL_MARGIN=2
    -DESGUI_3D_MENU_ITEM_GAP=8
    -DESGUI_3D_MENU_FOCAL=40
    -DESGUI_3D_MENU_DEPTH=20
    -DESGUI_3D_MENU_FOCUS_MARGIN=10
    ; 3D 菜单模型大小 = 焦点框尺寸的百分比（框架默认 65）。
    ; 这里取 33 → 模型显示尺寸约为框架默认值的 0.5 倍（本屏 83px 焦点框 → 模型 27 逻辑像素）
    -DESGUI_3D_MENU_MODEL_SCALE=33

